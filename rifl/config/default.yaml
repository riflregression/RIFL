# SafeMin runtime configuration. Prefer an environment variable for secrets.
model: gpt-5.6-luna
openai_api_key_env: OPENAI_API_KEY
# Optional convenience for a private, untracked config file:
openai_api_key: "#Your_Key_here"
output_dir: smoke-results/safemin
test_timeout: 1200
docker:
  reuse_container: true
selection:
  require_original_f2p_p2p: true
